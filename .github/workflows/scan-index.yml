# The cross-bundle scan index behind "what does everyone else put here?"
# (scripts/scan_index.ts, read by src/lib/server/keyscan.ts). Built from what is
# already stored: image indexes and blobs in R2, head OTA bundles from Apple. It
# never touches an IPSW; blobs and OTA files are cached across runs, so a run
# only downloads what is new.
#
# Runs after every successful System bundles run (daily, and whenever a new image
# lands), or by hand. The pointer (scan/current.json) records a hash of the head
# set it was built from, or none when a bundle failed; when the heads have not
# moved since a complete build, nothing is rebuilt unless `force` is set. Needs: secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID.

name: Scan index
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the head bundles have not changed
        type: boolean
        default: false
  workflow_run:
    workflows: [System bundles]
    types: [completed]

concurrency:
  group: scan-index
  cancel-in-progress: false

env:
  BUCKET: carrier-explode
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  scan-index:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Heads, compared with the ones the live index was built from
        id: heads
        env:
          FORCE: ${{ inputs.force }}
        run: |
          scripts/modems.sh indexes /tmp/idx
          npx vite-node scripts/scan_index.ts plan --builds /tmp/idx/builds.json --indexes /tmp/idx --out /tmp/heads.json |
            sort -u > /tmp/need.txt
          node_modules/.bin/wrangler r2 object get "$BUCKET/scan/current.json" --remote --pipe > /tmp/current.json 2>/dev/null ||
            echo '{}' > /tmp/current.json
          HASH=$(sha256sum /tmp/heads.json | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && [ "$(jq -r '.heads // empty' /tmp/current.json)" = "$HASH" ]; then
            echo "heads unchanged since $(jq -r .gen /tmp/current.json), nothing to rebuild"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Blobs are content-addressed and Apple URLs immutable, so the cache only grows.
      - if: steps.heads.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blobs
            /tmp/ota
          key: scan-bundles-${{ github.run_id }}
          restore-keys: scan-bundles-

      - name: Blobs not cached yet
        if: steps.heads.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/blobs
          comm -23 /tmp/need.txt <(ls /tmp/blobs | sed 's/\.ipcc$//' | sort) > /tmp/fetch.txt
          echo "$(wc -l < /tmp/fetch.txt) of $(wc -l < /tmp/need.txt) blobs to fetch"
          xargs -P 8 -I{} node_modules/.bin/wrangler r2 object get "$BUCKET/blobs/{}.ipcc" --remote --file "/tmp/blobs/{}.ipcc" \
            < /tmp/fetch.txt > /dev/null

      - name: Build
        if: steps.heads.outputs.changed == 'true'
        env:
          HASH: ${{ steps.heads.outputs.hash }}
        run: |
          PREV=$(jq -r '.gen // empty' /tmp/current.json)
          npx vite-node scripts/scan_index.ts build --heads /tmp/heads.json --blobs /tmp/blobs --cache /tmp/ota \
            --out /tmp/scan --heads-hash "$HASH" ${PREV:+--previous "$PREV"}

      - name: Upload, flip the pointer, drop the generation before last
        if: steps.heads.outputs.changed == 'true'
        run: |
          . scripts/lib.sh
          W="$PWD/node_modules/.bin/wrangler"
          cd /tmp/scan
          RETRY_TRIES=7 retry "$W" r2 bulk put "$BUCKET" --filename upload.json --remote --force --concurrency 6
          retry "$W" r2 object put "$BUCKET/scan/current.json" --file pointer.json --remote
          # The last generation stays: a warm worker may still hold its pointer for a few minutes.
          OLD=$(jq -r '.previous // empty' /tmp/current.json)
          if [ -n "$OLD" ]; then
            "$W" r2 object get "$BUCKET/scan/$OLD/_keys.json" --remote --pipe 2>/dev/null | jq -r '.[]' |
              xargs -P 8 -I{} "$W" r2 object delete "$BUCKET/{}" --remote > /dev/null || true
          fi

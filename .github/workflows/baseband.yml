# Modem packages for every held image, for every iPhone that received it.
#
# `plan` reads each held image's IPSW directories (every iPhone model's, over HTTP
# ranges; ipsw.me, else AppleDB for betas) and lists the packages no index points
# at yet, grouped by (name, size, CRC32): Firmware/*.bbfw (Qualcomm, Intel) and
# Firmware/c*/Release/**/ftab.bin (Apple C1). `fetch` legs range-extract just those
# members, store blobs/<sha256>.<bbfw|ftab>, and decode each into
# baseband/v<schema>/<sha256>.json (scripts/baseband.ts). `index` then sets `modems` in each
# system/<build>/index.json, for builds whose packages are all stored.
# Scripts: scripts/modems.py (plan, fetch, write), scripts/modems.sh (storage).
# New images get theirs from the extract job in system-bundles.yml, the same way.
#
# rebuild: re-decodes every stored package from its blob into baseband/v<schema>/<id>.json.
# Nothing is fetched from Apple and no index is touched. Run it whenever the
# decoder bumps MODEM_SUMMARY_SCHEMA (src/lib/decode/modem.ts), before deploying
# the worker that reads the new path.
#
# Either way, pages rendered from package summaries are purged at the end (the
# "baseband" cache tag).
#
# Needs: secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional: secret PURGE_TOKEN (purge.yml).

name: Baseband
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Re-decode every stored package instead of adding missing ones
        type: boolean
        default: false

concurrency:
  group: modems
  cancel-in-progress: false

env:
  BUCKET: carrier-explode
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -q
          scripts/modems.sh indexes /tmp/idx
          python3 scripts/modems.py plan --indexes /tmp/idx --legs 6 $([ "$REBUILD" = true ] && echo --rebuild) > /tmp/plan.json
          echo "legs=$(jq -c '[range(.legs | length)]' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            /tmp/plan.json
            /tmp/idx

  fetch:
    needs: plan
    if: needs.plan.outputs.legs != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # Keeps Apple's CDN and the R2 API comfortable.
      max-parallel: 3
      matrix:
        leg: ${{ fromJson(needs.plan.outputs.legs) }}
    name: packages ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /tmp/plan
      - run: scripts/modems.sh fetch /tmp/plan/plan.json ${{ matrix.leg }} /tmp/meta/${{ matrix.leg }}.jsonl
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.leg }}
          path: /tmp/meta
          if-no-files-found: ignore

  # One job for every index: they are small, and R2 prefers them in sequence.
  index:
    needs: fetch
    if: ${{ !cancelled() && !inputs.rebuild }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: /tmp/meta
          merge-multiple: true
      - name: Write the indexes, last
        run: |
          python3 scripts/modems.py write --plan /tmp/plan/plan.json --indexes /tmp/plan/idx --meta /tmp/meta --out /tmp/out
          scripts/modems.sh publish /tmp/out

  purge:
    needs: [fetch, index]
    if: ${{ !cancelled() && (needs.fetch.result == 'success' || needs.index.result == 'success') }}
    uses: ./.github/workflows/purge.yml
    with:
      tags: baseband
    secrets: inherit


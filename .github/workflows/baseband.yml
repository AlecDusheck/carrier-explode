# Baseband packages for images already in the bucket. New images get theirs
# from the extract job in system-bundles.yml; this is for the ones held before
# that, and for re-decoding after the decoder changes.
#
# Default: every held image whose index.json has no baseband entry gets one.
# It resolves the IPSW URL (scripts/plan_system_bundles.py --baseband-have:
# ipsw.me, else AppleDB for betas), pulls only Firmware/*.bbfw with HTTP range
# requests (about 140 MB, not the whole IPSW), and stores it the way the extract
# job does (scripts/attach_baseband.py): blobs/<id>.bbfw, the index entry, and
# system/<build>/baseband.json.
#
# rebuild: re-decodes every stored package from its blob and rewrites only
# system/<build>/baseband.json. Nothing is fetched from Apple, and bundles and
# indexes are not touched.
#
# Either way, pages rendered from baseband.json are purged at the end (the
# "baseband" cache tag).
#
# Needs: secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional: secret PURGE_TOKEN, as in system-bundles.yml.

name: Baseband
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Re-decode every stored package instead of adding missing ones
        type: boolean
        default: false

env:
  BUCKET: carrier-explode
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          npm install --no-save --silent wrangler
          W=node_modules/.bin/wrangler
          "$W" r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/builds.json
          : > /tmp/have.txt
          echo '[]' > /tmp/stored.json
          for b in $(jq -r '.[].build' /tmp/builds.json); do
            "$W" r2 object get "$BUCKET/system/$b/index.json" --remote --pipe > /tmp/index.json 2>/dev/null || continue
            if jq -e '.baseband.id' /tmp/index.json > /dev/null; then
              echo "$b" >> /tmp/have.txt
              jq --slurpfile i /tmp/index.json '. + [{version: $i[0].version, build: $i[0].build, blob: $i[0].baseband.id}]' \
                /tmp/stored.json > /tmp/next.json && mv /tmp/next.json /tmp/stored.json
            fi
          done
          if [ "$REBUILD" = "true" ]; then
            MATRIX=$(jq -c . /tmp/stored.json)
          else
            MATRIX=$(python3 scripts/plan_system_bundles.py --builds /tmp/builds.json --baseband-have /tmp/have.txt)
          fi
          echo "to process: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  baseband:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # Keeps Apple's CDN and the R2 API comfortable.
      max-parallel: 3
      matrix:
        image: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: iOS ${{ matrix.image.version }} (${{ matrix.image.build }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile

      - name: Install blacktop/ipsw
        if: ${{ !matrix.image.blob }}
        run: |
          URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest |
            jq -r '.assets[].browser_download_url | select(contains("arm64.deb")) | select(contains("ipsw_"))')
          curl -sL -o /tmp/ipsw.deb "$URL"
          sudo dpkg -i /tmp/ipsw.deb

      - name: Get the package
        env:
          URL: ${{ matrix.image.url }}
          BLOB: ${{ matrix.image.blob }}
        run: |
          mkdir -p /tmp/bb
          if [ -n "$BLOB" ]; then
            node_modules/.bin/wrangler r2 object get "$BUCKET/blobs/$BLOB.bbfw" --remote --file /tmp/bb/package.bbfw
          else
            ipsw extract --remote --pattern '.*\.bbfw$' --output /tmp/bb "$URL"
          fi
          BBFW=$(find /tmp/bb -name '*.bbfw' | sort | head -1)
          if [ -z "$BBFW" ]; then echo "no .bbfw for this image"; exit 1; fi
          echo "BBFW=$BBFW" >> "$GITHUB_ENV"

      - name: Decode
        run: |
          npx vite-node scripts/baseband.ts "$BBFW" --out /tmp/baseband.json
          if [ -z "${{ matrix.image.blob }}" ]; then
            node_modules/.bin/wrangler r2 object get "$BUCKET/system/${{ matrix.image.build }}/index.json" --remote --pipe > /tmp/index.json
            python3 scripts/attach_baseband.py --index /tmp/index.json --bbfw "$BBFW" --baseband /tmp/baseband.json --out /tmp/out
          fi

      - name: Upload to R2
        run: |
          W="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          if [ -n "${{ matrix.image.blob }}" ]; then
            "$W" r2 object put "$BUCKET/system/${{ matrix.image.build }}/baseband.json" \
              --file /tmp/baseband.json --content-type application/json --remote
            exit 0
          fi
          cd /tmp/out
          for attempt in 1 2 3 4 5; do
            "$W" r2 bulk put "$BUCKET" --filename upload.json --remote --force --concurrency 3 && break
            [ "$attempt" = 5 ] && exit 1
            sleep $(( 20 * 2 ** (attempt - 1) + RANDOM % 20 ))
          done
          # The index goes last, so it never points at a package that is not uploaded.
          "$W" r2 object put "$BUCKET/system/${{ matrix.image.build }}/index.json" \
            --file "system/${{ matrix.image.build }}/index.json" --content-type application/json --remote

  purge:
    needs: baseband
    if: ${{ !cancelled() && needs.baseband.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "PURGE_TOKEN not set, skipping"; exit 0; }
          curl -fsS -X POST https://carrierexplode.com/internal/purge \
            -H "authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d '{"tags":["baseband"]}'

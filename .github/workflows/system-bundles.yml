# Keeps R2 stocked with the carrier and country bundles from every iOS release.
# Most countries have no bundle on Apple's OTA server; theirs only ship inside
# the OS image.
#
# `plan` runs daily and costs a few seconds: it lists the releases we do not hold
# yet. `extract` only runs when there is one. The extraction steps are
# dwilliamsuk's, from https://github.com/dwilliamsuk/ios-carrier-bundles
# `extract` also stores the build's modem packages, for every iPhone that
# received it, the way baseband.yml does (scripts/modems.sh run): blobs/<id>.bbfw
# or .ftab, baseband/v<schema>/<id>.json, and the index's `modems` list.
#
# Needs: secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional: secret PURGE_TOKEN (purge.yml), so new images show up at once
# instead of when cached pages age out (six hours).
# Optional: variable MIN_VERSION, the oldest release to keep (default: the oldest
# image already held), and variable DEVICE (default iPhone17,1), whose IPSW names
# each image. Every other iPhone IPSW of the build is extracted too, since each
# carries only its own phones' override files. Releases that device no longer
# receives are named by the newest iPhone instead.
#
# Betas: the daily run also takes every iOS beta newer than the newest public
# release, from AppleDB (ipsw.me does not list betas). Their IPSWs are Apple's
# own public links, and they are recorded as "27.2 beta 2" so they sort below
# the release and never take its URL. Set variable BETAS to "false" to stop.
#
# GitHub disables scheduled workflows after 60 days without repo activity.

name: System bundles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Extract exactly this iOS version, held or not
        type: string
      since:
        description: Extract every release from this version up that is not held
        type: string
      max:
        description: Most images to extract in this run
        type: string
        default: "3"
      rebuild:
        description: Extract every image held again (after a change to what extraction keeps); ignores max
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * *"

env:
  BUCKET: carrier-explode
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ipsws: ${{ steps.plan.outputs.ipsws }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -q
          node_modules/.bin/wrangler r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/builds.json 2>/dev/null || echo '[]' > /tmp/builds.json
          MATRIX=$(python3 scripts/plan_system_bundles.py --builds /tmp/builds.json \
            --device "${{ vars.DEVICE || 'iPhone17,1' }}" --version "${{ inputs.version }}" \
            --since "${{ inputs.since || vars.MIN_VERSION }}" --max "${{ inputs.max || '3' }}" \
            ${{ vars.BETAS == 'false' && '--no-betas' || '' }} ${{ inputs.rebuild && '--rebuild' || '' }})
          echo "to extract: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          # One extract job per IPSW: {build, n, device, url}, n counting from 1 within the build.
          echo "ipsws=$(jq -c '[.[] as $i | $i.ipsws | to_entries[] | {build: $i.build, n: (.key + 1), device: .value.device, url: .value.url}]' <<<"$MATRIX")" >> "$GITHUB_OUTPUT"

  # One job per IPSW, many at once: each downloads one image, pulls its bundle
  # directories out and hands them on as an artifact of a few MB.
  extract:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        ipsw: ${{ fromJson(needs.plan.outputs.ipsws) }}
    name: ${{ matrix.ipsw.build }} ${{ matrix.ipsw.device }}
    timeout-minutes: 90
    steps:
      - name: Install blacktop/ipsw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo blacktop/ipsw --pattern 'ipsw_*_linux_arm64.deb' --output /tmp/ipsw.deb
          sudo dpkg -i /tmp/ipsw.deb

      - name: Install apfs-fuse
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev bzip2 libbz2-dev libz-dev cmake build-essential libattr1-dev
          sudo modprobe fuse
          git clone --recursive https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build
          sudo make -C /tmp/apfs-fuse/build install

      - name: Download the IPSW and extract the bundles
        env:
          URL: ${{ matrix.ipsw.url }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipsw" /tmp/x
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/ipsw/image.ipsw" "$URL"
          # ipsw's own scratch (the decrypted filesystem image) stays on the runner's temp disk.
          TMPDIR="$RUNNER_TEMP/ipsw" ipsw extract --files --pattern '.*Bundles.*iPhone.*\.bundle.*$' --output /tmp/x "$RUNNER_TEMP/ipsw/image.ipsw"
          ipsw info "$RUNNER_TEMP/ipsw/image.ipsw" --json --no-color > /tmp/x/meta.json
          sudo chown -R "$USER" /tmp/x
          ROOT=$(echo /tmp/x/*/root/System/Library)
          mkdir -p /tmp/a
          mv "$ROOT/Carrier Bundles/iPhone" /tmp/a/carriers
          mv "$ROOT/CountryBundles/iPhone" /tmp/a/countries
          mv /tmp/x/meta.json /tmp/a/meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.ipsw.build }}-${{ matrix.ipsw.n }}
          path: /tmp/a
          retention-days: 1
          if-no-files-found: error

  # One job per build, once every IPSW is extracted: merges the images' bundles,
  # adds the modem packages and uploads.
  package:
    needs: [plan, extract]
    # A failed IPSW must not hold back the other builds; this build's own count check catches it.
    if: ${{ !cancelled() && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Two at a time keeps the R2 API under its rate limit.
      max-parallel: 2
      matrix:
        image: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: iOS ${{ matrix.image.version }} (${{ matrix.image.build }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-${{ matrix.image.build }}-*
          path: /tmp/x

      - name: Package
        env:
          # The image itself says 27.2; the planner knows it is 27.2 beta 2.
          LABEL: ${{ matrix.image.label || '' }}
          RELEASED: ${{ matrix.image.released || '' }}
          WANT: ${{ toJson(matrix.image.ipsws) }}
          BUILD: ${{ matrix.image.build }}
        run: |
          want=$(jq length <<<"$WANT")
          have=$(ls /tmp/x | wc -l)
          # Every IPSW or none: a partial merge would quietly drop phones.
          [ "$have" -eq "$want" ] || { echo "::error::$have of $want IPSWs extracted"; exit 1; }
          node_modules/.bin/wrangler r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/builds.json 2>/dev/null || echo '[]' > /tmp/builds.json
          # Blobs are content-addressed; skip the ones an earlier image already uploaded.
          mkdir -p /tmp/idx
          if [ "$(jq length /tmp/builds.json)" -gt 0 ]; then scripts/modems.sh indexes /tmp/idx; fi
          cat /tmp/idx/*/index.json 2>/dev/null | jq -r '(.carriers, .countries)[].id' > /tmp/have.txt || true
          ARGS=()
          for n in $(seq 1 "$want"); do
            d="/tmp/x/bundles-$BUILD-$n"
            ARGS+=(--carriers "$d/carriers" --countries "$d/countries" --meta "$d/meta.json")
          done
          python3 scripts/package_system_bundles.py "${ARGS[@]}" \
            --out /tmp/out --builds /tmp/builds.json --have /tmp/have.txt \
            ${LABEL:+--version "$LABEL"} ${RELEASED:+--released "$RELEASED"}

      # Best effort: a package that cannot be read must not cost the image its bundles.
      # Runs before the upload, so the index goes up once, with its modems.
      - name: Modem packages
        continue-on-error: true
        env:
          BUILD: ${{ matrix.image.build }}
        run: |
          mkdir -p "/tmp/idx/$BUILD"
          cp "/tmp/out/system/$BUILD/index.json" "/tmp/idx/$BUILD/index.json"
          scripts/modems.sh run /tmp/idx /tmp/out "$BUILD"

      - name: Upload to R2
        run: |
          . scripts/lib.sh
          W="$PWD/node_modules/.bin/wrangler"
          cd /tmp/out
          # Content-addressed keys: the whole upload can be retried.
          RETRY_TRIES=7 retry "$W" r2 bulk put "$BUCKET" --filename upload.json --remote --force --concurrency 6
          # builds.json goes last so the app never lists a half-uploaded image.
          # Re-read and merge right before writing: matrix jobs overlap.
          "$W" r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/now.json 2>/dev/null || echo '[]' > /tmp/now.json
          python3 "$GITHUB_WORKSPACE/scripts/versions.py" merge /tmp/now.json builds.json > merged.json
          "$W" r2 object put "$BUCKET/system/builds.json" --file merged.json --remote

  # Once, after every image is in: pages that track the newest bundle are cached
  # for six hours, and this is what makes a new image visible now. Runs even if
  # one image failed, since the others still landed.
  purge:
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    uses: ./.github/workflows/purge.yml
    with:
      tags: latest
    secrets: inherit

# Keeps R2 stocked with the carrier and country bundles from every iOS release.
# Most countries have no bundle on Apple's OTA server; theirs only ship inside
# the OS image.
#
# `plan` runs daily and costs a few seconds: it lists the releases we do not hold
# yet. `extract` only runs when there is one. The extraction steps are
# dwilliamsuk's, from https://github.com/dwilliamsuk/ios-carrier-bundles
#
# Needs: secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional: secret PURGE_TOKEN, the same value as the worker's, so new images
# show up at once instead of when cached pages age out (six hours).
# Optional: variable MIN_VERSION, the oldest release to keep (default: the oldest
# image already held), and variable DEVICE (default iPhone17,1). Releases that device no longer
# receives are taken from the newest iPhone instead.
#
# Betas: the daily run also takes every iOS beta newer than the newest public
# release, from AppleDB (ipsw.me does not list betas). Their IPSWs are Apple's
# own public links, and they are recorded as "27.2 beta 2" so they sort below
# the release and never take its URL. Set variable BETAS to "false" to stop.
#
# GitHub disables scheduled workflows after 60 days without repo activity.

name: System bundles
on:
  workflow_dispatch:
    inputs:
      version:
        description: Extract exactly this iOS version, held or not
        type: string
      since:
        description: Extract every release from this version up that is not held
        type: string
      max:
        description: Most images to extract in this run
        type: string
        default: "3"
  schedule:
    - cron: "17 5 * * *"

env:
  BUCKET: carrier-explode
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -q
          npx --yes wrangler r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/builds.json 2>/dev/null || echo '[]' > /tmp/builds.json
          MATRIX=$(python3 scripts/plan_system_bundles.py --builds /tmp/builds.json \
            --device "${{ vars.DEVICE || 'iPhone17,1' }}" --version "${{ inputs.version }}" \
            --since "${{ inputs.since || vars.MIN_VERSION }}" --max "${{ inputs.max || '3' }}" \
            ${{ vars.BETAS == 'false' && '--no-betas' || '' }})
          echo "to extract: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # Two at a time keeps the R2 API under its rate limit.
      max-parallel: 2
      matrix:
        image: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: iOS ${{ matrix.image.version }} (${{ matrix.image.build }})
    steps:
      - uses: actions/checkout@v4

      - name: Install blacktop/ipsw
        run: |
          URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest |
            jq -r '.assets[].browser_download_url | select(contains("arm64.deb")) | select(contains("ipsw_"))')
          curl -sL -o /tmp/ipsw.deb "$URL"
          sudo dpkg -i /tmp/ipsw.deb

      - name: Install apfs-fuse
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev bzip2 libbz2-dev libz-dev cmake build-essential libattr1-dev
          sudo modprobe fuse
          git clone --recursive https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build
          sudo make -C /tmp/apfs-fuse/build install

      - name: Download the IPSW and extract the bundles
        env:
          URL: ${{ matrix.image.url }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipsw" /tmp/x
          if [ -n "$URL" ]; then
            # Betas: ipsw.me does not know them, so the planner hands over Apple's link.
            curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/ipsw/image.ipsw" "$URL"
          else
            ipsw download ipsw --device "${{ matrix.image.device }}" --build "${{ matrix.image.build }}" \
              --no-color --output "$RUNNER_TEMP/ipsw"
          fi
          ipsw extract --files --pattern '.*Bundles.*iPhone.*\.bundle.*$' --output /tmp/x "$RUNNER_TEMP"/ipsw/*.ipsw
          ipsw info "$RUNNER_TEMP"/ipsw/*.ipsw --json --no-color > /tmp/meta.json
          sudo chown -R "$USER" /tmp/x

      - name: Package
        env:
          # The image itself says 27.2; the planner knows it is 27.2 beta 2.
          LABEL: ${{ matrix.image.beta && matrix.image.version || '' }}
        run: |
          npm install --no-save --silent wrangler
          W="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          "$W" r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/builds.json 2>/dev/null || echo '[]' > /tmp/builds.json
          # Blobs are content-addressed; skip the ones an earlier image already uploaded.
          : > /tmp/have.txt
          for b in $(jq -r '.[].build' /tmp/builds.json); do
            "$W" r2 object get "$BUCKET/system/$b/index.json" --remote --pipe 2>/dev/null |
              jq -r '(.carriers, .countries)[].id' >> /tmp/have.txt || true
          done
          ROOT=$(echo /tmp/x/*/root/System/Library)
          python3 scripts/package_system_bundles.py \
            --carriers "$ROOT/Carrier Bundles/iPhone" \
            --countries "$ROOT/CountryBundles/iPhone" \
            --meta /tmp/meta.json --out /tmp/out --builds /tmp/builds.json --have /tmp/have.txt \
            ${LABEL:+--version "$LABEL"}

      - name: Upload to R2
        run: |
          W="$GITHUB_WORKSPACE/node_modules/.bin/wrangler"
          cd /tmp/out
          # R2's API answers 429 under load. The upload is idempotent
          # (content-addressed keys), so retry the whole thing with backoff.
          for attempt in 1 2 3 4 5 6 7; do
            "$W" r2 bulk put "$BUCKET" --filename upload.json --remote --force --concurrency 6 && break
            [ "$attempt" = 7 ] && exit 1
            delay=$(( 20 * 2 ** (attempt - 1) + RANDOM % 20 ))
            echo "upload failed (attempt $attempt), retrying in ${delay}s"
            sleep "$delay"
          done
          # builds.json goes last so the app never lists a half-uploaded image.
          # Re-read and merge right before writing: matrix jobs overlap.
          "$W" r2 object get "$BUCKET/system/builds.json" --remote --pipe > /tmp/now.json 2>/dev/null || echo '[]' > /tmp/now.json
          python3 "$GITHUB_WORKSPACE/scripts/versions.py" merge /tmp/now.json builds.json > merged.json
          "$W" r2 object put "$BUCKET/system/builds.json" --file merged.json --remote

  # Once, after every image is in: pages that track the newest bundle are cached
  # for six hours, and this is what makes a new image visible now. Runs even if
  # one image failed, since the others still landed.
  purge:
    needs: extract
    if: ${{ !cancelled() && needs.extract.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "PURGE_TOKEN not set, skipping"; exit 0; }
          curl -fsS -X POST https://carrierexplode.com/internal/purge \
            -H "authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d '{"tags":["latest"]}'
